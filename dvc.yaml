stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
    outs:
      - data/raw

  preprocess:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw
    outs:
      - data/processed

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed
    params:
      - train.epochs
      - train.batch_size
      - train.learning_rate
    outs:
      - model/ann_model.h5

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - model/ann_model.h5
    metrics:
      - metrics.json:
          cache: false